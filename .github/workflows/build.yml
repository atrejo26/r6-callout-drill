name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build lite launcher
        shell: bash
        run: |
          cp index.html launcher/index.html
          cd launcher && go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/R6-Callout-Drill-Lite.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: R6-Callout-Drill-windows
          path: dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
